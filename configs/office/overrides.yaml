# Настройки только для записи офиса: поверх configs/config.yaml. EPFL они не касаются.
# Расстояния ниже заданы для шага 1.3 м/с. Шаг на плане измеряется по самим людям, и они пересчитываются автоматически.
# Модель PersonViT и вычитание среднего камеры меняют шкалу сходства: один человек около 0.61, разные около 0.06,
# верх разных 0.38–0.50. Поэтому все пороги внешности здесь свои.
reid:
  backend: personvit
  model_name: personvit_s
  weights: weights/personvit_msmt17_s.safetensors
  app_cut_thr: 0.45
  app_cut_min: 0.40
  app_cut_margin: 0.15
crops:                         # вектор нужен почти каждому куску: иначе короткие куски становятся лишними людьми
  min_q: 0.10
  every: 2
link:
  ahc_thr: 0                   # люди по времени и месту, внешность только проверяет: группы по внешности (0.28) сливали всех в чёрном, 87 с «один человек в двух местах» против 11
  seq_cross_need_app: true     # кусок из 3 кадров без вектора соединял человека в серых штанах с человеком в худи
  seq_no_skip: true            # связь через паузу перепрыгивала продолжение: крупный соединялся с человеком в джинсовке
  seq_gap_app_min: 0.55       # за паузу дольше 1 с рядом мог оказаться другой: внешность должна совпасть заметно
  seq_strict_gap_s: 1.0       # пауза до 1 с на камере: сверяются сами концы, иначе номер перескакивает на проходящего мимо
  seq_overlap_samples: 12      # перекрытие короче 1 с на краях обзоров — передача между камерами, а не два человека
  seq_cross_margin_m: 1.5      # на краю кадра и у лестницы план точен хуже: запас передачи больше
  ahc_min_obs: 15            # группы строят только куски от 15 наблюдений: короткие дают шумный вектор
  ahc_short_thr: 0.30          # короткий кусок идёт к самой похожей группе
  ahc_small_obs: 0
  clothes_veto: 0              # на разметке запрет по яркости только мешал: полнота 0.56 против 0.70
  coord_far_m: 0               # координаты в группировке выключены; проба: 10 м и добавка 0.12 дали F 0.81 и 20 людей
  cam_debias: 0.5
  scene_lam: 0.001
  purge_min: 0                 # разбор групп на разметке не помог: при 0.3–0.4 F тот же, выше рвёт людей
  app_strong: 0.60
  app_handoff_min: 0.40
  app_margin: 0.30
  app_reject: 0.40            # рядом на двух камерах, но непохожи: при 0.30 крупный человек сливался с парнем в белом
  part_min: 0.15               # низ тела отдельно: разводит людей в чёрном с разными штанами; значение пока не проверено
  group_seam_app_min: 0.35    # группы тёмной одежды в среднем похожи: продолжение сверяется по кускам на стыке
  app_ambiguity: 0.05
  seq_app_min: 0.30
  group_handoff_app: 0.55
  group_soft_app: 0.55
tracks:
  cont_gap_s: 1.0              # очевидное продолжение на той же камере — один трек: иначе разрез по внешности рвёт идущего
  phantom_by_fov: false        # зона обзора на плане проходит сквозь стены: настоящих людей принимало за фантомов
  clothes_veto: 0
  clothes_bonus: 0
  cam_debias: 0.5
  scene_lam: 0.001
  part_min: 0.15
  person_link_min: 0.70       # группа склейки могла собраться через случайное звено: номер человека требует внешности
  absorb_same_cam_s: 0.5      # двое рядом — не дубль: поглощение сливало людей, идущих вместе, в один трек
  person_twice_sim: 0.60      # одна мелкая фигура в дальних концах двух камер: план там ошибается на метры
  person_small_s: 8           # обрывки до 8 с не становятся новыми людьми; проверяется разметкой в office_diag
  person_twice_m: 8.0          # 3 м проверено: F 0.90 -> 0.84, смесь P4 не ушла, а человек в футболке распался
  cont_m: 1.0
  person_twice_s: 14         # вместе не дольше: иначе это двое, а не один на двух камерах
  person_app_min: 0.70
  person_app_floor: 0.50
  person_app_margin: 0.45
  absorb_app_sim: 0.60
  absorb_near_sim: 0.50
