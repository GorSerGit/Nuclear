# config.yaml — все пороги обработки (раздел 6 ТЗ). Любой ключ можно убрать — возьмётся дефолт из mtmc/config.py.
video:
  stride: 2                    # обрабатывать каждый N-й кадр
  exact_seek: true             # к --start перематывать последовательно (точный номер кадра)

gate:                          # пропуск пустых кадров (mtmc/gate.py)
  enabled: false               # выключено: детектор идёт по всем кадрам (с учётом stride)
  check_s: 1.0                # пустую сцену детектор всё равно проверяет так часто
  hold_s: 3.0                  # после последнего человека кадры идут все
  width: 480                   # ширина уменьшенного кадра для сравнения
  diff: 14                     # изменение яркости пикселя, 0–255
  min_share: 0.0002            # изменилась такая доля кадра — запускаем детектор
  noise_hits: 3                # столько раз изменилось без людей — шум: часы в кадре, экран

detector:
  weights: weights/yolo11m-pose.pt
  imgsz: 1280                  # меньше — быстрее, но теряются дальние люди
  conf: 0.10                   # низкий порог: отсевом занимается трекер
  half: true                   # FP16 на GPU
  device: cuda:0               # или cpu / mps

tracker:                       # передаётся в BoT-SORT (временный yaml)
  tracker_type: botsort
  track_high_thresh: 0.5
  track_low_thresh: 0.1
  new_track_thresh: 0.6
  track_buffer_s: 2.0          # пересчитывается в кадры: round(2.0 * fps / stride)
  match_thresh: 0.8
  fuse_score: true
  gmc_method: none             # камеры неподвижны
  proximity_thresh: 0.5
  appearance_thresh: 0.25
  with_reid: true
  model: auto

observation:
  kp_conf: 0.5
  foot_body_ratio: 1.6         # ноги ≈ 1.6 × (плечи→бёдра)
  sigma_px: 4.0
  sigma_base_m: 0.15
  sigma_mult: {ankles: 1.0, body: 1.6, box: 2.0}
  view_side_thr: 0.15
  zone_share: 0.6              # столько рамки в ignore_zones паспорта, и низ рамки там же — не человек (экран, зеркало)
  quality:
    h_min: 60
    h_good: 160
    edge_px: 4
    trunc_factor: 0.3
    occ_max: 0.4
    blur_ref: 150

crops:
  min_q: 0.35
  every: 3
  pad: 0.05
  jpeg_quality: 90

tracklets:
  gap_cut_s: 1.5
  v_max_mps: 3.0               # правило скачка с гомографией
  jump_sigma_k: 3.0
  v_max_heights_ps: 2.5        # правило скачка без гомографии
  jump_px_margin_h: 0.5
  min_len: 5
  smooth_window: 7
  smooth_poly: 2
  edge_speed_window_s: 0.5     # скорость в начале/конце треклета

reid:
  backend: torchreid           # torchreid | none (без эмбеддингов и правила 3)
  model_name: osnet_x1_0
  weights: weights/osnet_x1_0_msmt17.pth
  device: null                 # null -> как у детектора
  batch: 64
  flip_tta: true
  max_crops: 32
  time_bins: 8
  app_cut_thr: 0.65            # верхний предел порога разреза; на EPFL порог сцены 0.61–0.64, на камерах офиса с малым
                               # числом одновременных людей мера завышена, и выше предела разрез режет одного человека
  app_cut_min: 0.55            # нижний предел (значение ТЗ); сам порог считается по камере: см. app_cut_margin
  app_cut_margin: 0.10         # порог = медиана сходства людей, которых камера видела вместе, плюс это
  app_cut_min_side: 4
  app_cut_min_total: 8
  proto_min: 2
  clothes_cut: 75              # подмена в треклете: яркость верха или низа сменилась на столько (0–255)
  clothes_cut_side: 4          # кропов с каждой стороны от подмены
  clothes_spread: 2.5          # скачок больше разброса внутри стороны во столько раз

render:
  trail_s: 2.0
  box_thickness: 2
  weak_thickness: 1
  foot_radius: 4
  interp_max_gap_steps: 1      # интерполяция рамок только между соседними обработанными кадрами
  crf: 23
  preset: veryfast
  ffmpeg: ffmpeg
  font: null                   # путь к TTF (нужна кириллица); null -> Arial / DejaVuSans
  font_size: 16
  minimap_px: 320
  minimap_margin_m: 1.0
  zones_alpha: 0.25
  clip_pad_s: 1.0

gallery:
  crops_per_row: 8
  crop_h: 128
  rows_per_file: 50
  label_w: 330
  jpeg_quality: 90

link:                          # часть 2: склейка треклетов в людей (python -m mtmc link)
  grid_s: 0.08                 # шаг общей сетки времени (stride / fps)
  min_obs: 3                   # короче — не связываются, остаются отдельными людьми
  min_overlap_samples: 5       # одновременные треклеты разных камер: минимум общих моментов
  d_same_m: 0.6                # медианное расстояние на плане для «один человек» (+ sigma_k * σ)
  sigma_k: 1.0
  near_m: 1.0
  near_frac_min: 0.6           # доля общих моментов ближе near_m
  d_diff_m: 2.0                # медиана больше — точно разные люди (запрет склейки)
  cannot_far_min_samples: 12   # …если пересекались не меньше ~1 с
  group_handoff_m: 1.2         # передача между крупными группами: конец/начало ближе этого
  group_handoff_app: 0.8       # …и средняя внешность групп похожа не меньше
  group_handoff_max_overlap_s: 1.0
  group_handoff_min_obs: 50
  group_soft_m: 0.8            # группы идут рядом (медиана ближе) …
  group_soft_near: 0.7         # … большую часть общего времени …
  group_soft_app: 0.8          # … и выглядят одинаково — это один человек,
  group_soft_min_samples: 10
  group_soft_conflict_frac: 0.1    # даже если между их треклетами есть редкие (≤ 10%) запреты; у разных людей ~30–40%
  app_reject: 0.45             # прототипы внешности непохожи сильнее — не связываем
  app_strong: 0.80             # такое сходство внешности важнее расхождения на плане (спасение, поправка камер)
  app_sure_min_obs: 24         # …если у обоих кусков столько наблюдений: вектор короткого куска шумный
  sure_max_m: 3.5              # уверенной внешности прощается такое расхождение на плане
  xy_weight: 0.7               # вес расстояния при выборе пары: меньше — координаты решают меньше
  clothes_veto: 80             # яркость верха или низа разошлась сильнее — разные люди; 0 — выключено
  dup_cover: 0.9               # двойник: такая доля меньшей рамки лежит в другой рамке того же кадра…
  dup_share: 0.9               # …на такой доле общих кадров…
  dup_min_frames: 25           # …и общих кадров не меньше; мягче склеивает соседей (EPFL 4p: 40 ложных пар)
  app_margin: 0.13             # порог сцены: настолько похожее, чем люди, которых одна камера видела вместе
  app_handoff_min: 0.60        # порог сцены не опускается ниже
  app_ambiguity: 0.03          # соперник ближе этого — пара неоднозначна, не соединяем
  handoff_max_s: 15.0          # переход между камерами по внешности (работает и без плана): макс. пауза; 0 — выключено
  handoff_overlap_s: 1.0       # допустимое наложение времени при переходе
  rescue_max_m: 2.5            # спасение разорванных людей: куски дальше не соединяем; 0 — выключено
  app_tol_m: 0.6               # спасение передачи между камерами: столько метров сверх обычного запаса
  shift_max_m: 2.0             # поправка положения камер по людям: 0 — выключена; пара дальше не голосует
  shift_min_m: 0.4             # поправка меньше этого не применяется: при точной привязке это шум
  shift_spread_m: 0.5          # разброс смещения в паре: шире — это разные люди, а не ошибка привязки
  shift_min_samples: 25        # общих моментов в паре
  shift_min_pairs: 2           # пар на две камеры: один похоже одетый сосед камеру не сдвинет
  seq_max_gap_s: 8.0           # последовательные треклеты (одна камера или передача между камерами): макс. пауза
  seq_v_max_mps: 2.0
  seq_margin_m: 0.75
  seq_app_min: 0.6
  seq_noapp_gap_s: 1.0
  seq_edge_window_s: 0.5
  same_cam_overlap_s: 0.2
  dup_max_m: 0.4               # одновременные треклеты одной камеры ближе — дубль одного человека
  group_passes: 3              # проходы склейки собранных групп по общей траектории
  major_min_s: 10.0           # в отчёте «основные» люди — присутствуют не меньше

tracks:                        # сквозные треки (python -m mtmc tracks)
  end_gap_s: 2.0               # человека не видит ни одна камера дольше — трек завершён, дальше новый трек
  min_track_s: 2.0             # короче — шум, в счёт не идёт
  min_track_obs: 10
  cam_merge_gap_s: 1.0         # интервалы одной камеры с паузой меньше — один интервал в списке
  map_step_s: 0.2              # шаг точек пути на плане
  absorb_m: 0.8                # дубль: короткий трек всё время (≥ absorb_overlap) ближе absorb_m к другому —
  absorb_overlap: 0.8          #   недосклеенный кусок того же человека, поглощается
  absorb_app_m: 2.0            # …или ближе absorb_app_m, но с той же внешностью (сходство ≥ absorb_app_sim)
  absorb_app_sim: 0.85
  absorb_app_overlap: 0.5      #   (и целиком внутри другого трека по времени)
  absorb_near_m: 1.0           #   ближе этого хватает сходства absorb_near_sim
  absorb_near_sim: 0.80
  phantom_max_s: 15.0          # фантом: видела одна камера, хотя точка была в обзоре ≥ 2 других, —
  phantom_inside: 0.8          #   ложная детекция, в счёт не идёт
  phantom_min_other_cams: 2
  detect_gap_max_s: 8.0        # пропуск детекции: исчез и появился ВНУТРИ зоны камеры (не у края, не в зоне
  fov_margin_m: 0.5            #   выхода), рядом с тем же местом, за ≤ 8 с — трек и ID сохраняются
  bridge_v_max_mps: 1.5
  ghost_max_s: 15.0            # призрак: короткий трек, у которого сразу плохое качество, большое перекрытие
  ghost_q_max: 0.15            #   и низкая уверенность — ложная детекция рядом с людьми, в счёт не идёт
  ghost_occ_min: 0.35          #   (EPFL: у людей q ≥ 0.23 и перекрытие ≤ 0.19; у призрака 0.07 и 0.45)
  ghost_conf_max: 0.65
  person_app_min: 0.80       # люди: треки одного человека (ушёл и вернулся) — сходство внешности не ниже
  person_app_floor: 0.72       #   (EPFL: один человек 0.95–0.99, разные ≤ 0.80); ни одна пара в группе не ниже floor
  person_app_margin: 0.20      #   порог сцены: настолько похожее, чем люди, которых одна камера видела вместе
  person_overlap_tol_s: 0.5    #   треки одного человека не идут одновременно
  clothes_veto: 80             # одежда явно разная — разные люди; 0 — выключено
  clothes_bright: 90           # заметная одежда: хотя бы одна зона светлее этого
  clothes_near: 30             # совпала: обе зоны ближе этого
  clothes_bonus: 0.06          # заметная совпавшая одежда снижает порог внешности настолько

autocalib:                     # автопривязка к плану (python -m mtmc autocalib)
  person_height_m: 1.70        # средний рост — масштаб (если в site.json нет height_m камеры)
  hfov_prior_deg: 65           # типичный угол обзора; при общих зонах выбирается из hfov_grid
  hfov_grid: [45, 55, 65, 75, 90, 105]
  resid_ok: 0.15               # ошибка модели «человек стоит вертикально» (доля роста в кадре)
  wall_thr: 110                # пиксели плана темнее — стены
  los_ok: 0.9                  # доля точек, видимых камерой без стен на пути
  overlap_ok_m: 0.5            # расхождение с соседними камерами в общих зонах
  pos_prior_m: 0.5             # насколько можно сдвинуть отмеченное положение камеры

silhouette:                    # силуэты (контуры фигур) поверх найденных людей (python -m mtmc silhouettes)
  enabled: true                # строить сразу после process
  weights: weights/yolo11m-seg.pt
  imgsz: 960                   # null -> как у детектора; маске хватает меньшего разрешения
  conf: 0.25
  batch: 4                     # больше — на 8 ГБ видеопамяти резко медленнее
  iou_match: 0.5               # маска относится к человеку, если рамки совпадают не хуже
  simplify_frac: 0.01          # упрощение контура: доля роста человека в кадре
  max_pts: 48
  every: 1                     # маска на каждом N-м кадре, в промежутках контур сдвигается за рамкой

ui:                            # интерфейс (python -m mtmc ui)
  max_height: 720              # видео выше — уменьшаются для браузера
  crf: 24
  gop: 12                      # опорный кадр каждые N кадров — быстрая перемотка
  skeleton: true               # рисовать позу (силуэт) поверх рамки

io:
  flush_rows: 50000
